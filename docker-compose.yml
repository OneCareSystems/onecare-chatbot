services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_pw
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports: ["3306:3306"]
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_dev_pw"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: .
    environment:
      DB_NAME: onecare_chatbot
      DB_USER: chatbot_app
      DB_PASSWORD: chatbot_dev_pw
      DB_HOST: db
    command: sh -c "python manage.py migrate && gunicorn onecare_chat.wsgi:application --bind 0.0.0.0:8000"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  dbdata: {}